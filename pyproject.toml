[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "0.1.0"
description = "RAG over arXiv abstracts, with a retrieval evaluation experiment"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_lab = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import from the scripts/ folder

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # errors, pyflakes, import order, bugbear, pyupgrade

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]  # notebook cells import things where they are first used
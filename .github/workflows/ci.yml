# CI = Continuous Integration: on every push / pull request, GitHub starts a fresh Linux
# machine, installs the project and checks it. A red X on GitHub = something broke.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (pytest)
        run: pytest -v

  docker:
    needs: test # only runs if the tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the Docker image
        run: docker build -t rag-eval-lab .

      - name: Smoke test - start the container and call /health
        run: |
          docker run -d -p 8000:8000 -e LLM_API_KEY=dummy --name app rag-eval-lab
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo " -> healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
